[package]
name = "spike-2435"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Spike #2435: a headless probe of ray queries on the pinned wgpu (=30.0.1) and Metal, counting four
# answers #475 needs before rays draw: lost candidates, a top level built beside a new bottom level,
# surfaces on the same vertices, and rebuild-only structures. Outside the workspace, with its own
# Cargo.lock, so nothing it pins reaches the app.
[workspace]

[dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "metal", "parking_lot"] }
pollster = "0.4"
bytemuck = "1"
serde_json = { version = "1", features = ["preserve_order"] }
blake3 = "1"
log = "0.4"

[profile.release]
debug = false
strip = "none"
