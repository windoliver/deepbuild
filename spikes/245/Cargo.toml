[package]
name = "spike-245"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Spike #245: step blocks (Logic: step blocks) in both forms on the 8,000-agent steering fixture
# (`steer.wat`), through sandbox@1's check and logic rewrite on wasmtime =49.0.5, as deep-logic runs
# a program. `libc` maps the copy-on-write instances and reads page faults. Outside the workspace,
# with its own Cargo.lock, so nothing it pins reaches the app.
[workspace]

[dependencies]
deep-canvas-sandbox = { path = "../../crates/deep-canvas-sandbox" }
wasmtime = { version = "=49.0.5", default-features = false, features = ["cranelift", "runtime", "std"] }
wat = "=1.263.0"
libc = "0.2"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"

[profile.release]
debug = false
