[package]
name = "deep-codecs"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Issue #498: the decode worker, the trusted ring's host for the codecs seam (canvas primitives:
# Decode worker), and the encode tool's own process (Export: encode job). Probing, decoding and
# proxies run only in the worker, a process of its own with no network; encoding runs only in the
# encode tool's. A binary that links this crate starts each as a copy of itself with the argument
# `decode-worker` or `encode-tool` and hands that process to `serve`.

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Issue #423: KTX2 maps (Basis Universal ETC1S or UASTC) transcoded to BC in the decode worker.
basisu_c_sys = { version = "0.9.1", features = ["extra"] }
# Issue #503: our own audio decoders, pure Rust so the web player builds the same ones for
# wasm32: MP3, Vorbis and ALAC; AAC-LC and HE-AAC; Opus, a port of the reference decoder's float
# form, built without std so its math runs through libm, as Opus's output gain does here. FLAC
# is decoded by flac.rs.
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "vorbis", "alac"] }
rusty_aac = "2.0.1"
opus-rs = { version = "0.1.42", default-features = false, features = ["libm"] }
libm = "0.2.16"
# Issue #1967: terminal recordings, converted at import by the cells module's emulator.
deep-canvas-cells = { path = "../deep-canvas-cells" }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
