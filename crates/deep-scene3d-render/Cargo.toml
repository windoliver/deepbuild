[package]
name = "deep-scene3d-render"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
rust-version = "1.95"

# Issue #378: scene3d's render module on the GPU layer (#377). Each 3D writer layer is a batch:
# its instance records live in buffers written only where a record changed, and its draws are
# recorded once into a render bundle that replays every frame while its draw key (the pipelines,
# bind groups and buffers it binds, by resource, and its draws with their counts) holds. Depth is
# reversed Z with an infinite far plane; an object-ID target carries each item's pick ID; one
# output pass applies the look's exposure and tone map and encodes sRGB into the slot.
[dependencies]
# A material operator's checked graph and the core's WGSL for it (#429).
deep-canvas-effects = { path = "../deep-canvas-effects" }
deep-canvas-scene3d = { path = "../deep-canvas-scene3d" }
# Issue #464: the look's print fields the print pass draws.
deep-canvas-marks = { path = "../deep-canvas-marks" }
deep-gpu = { path = "../deep-gpu" }
# #2513: render.exposure's query and sums, which its GPU reduction answers.
deep-canvas = { path = "../deep-canvas" }
bytemuck = { version = "1", features = ["derive"] }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"] }
wgpu-profiler = "0.28"
# #172: a time read on the page's clock in the web player, the system's elsewhere.
web-time = "=1.1.0"
# Issue #2738 (from #425): a proxy band's mesh, simplified once per content key where a scene is
# drawn, so scene3d, and deep-physics through it, links no C++.
meshopt = "0.7"

[dev-dependencies]
serde_json = "1"
naga = { version = "30", default-features = false, features = ["wgsl-in"] }

