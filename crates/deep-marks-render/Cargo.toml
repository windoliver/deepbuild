[package]
name = "deep-marks-render"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
rust-version = "1.95"

# Issue #391: `deep-canvas-render`, the proof surface for the line's 2D marks: a document's view
# drawn headless with GPUI's offscreen Metal renderer, frames presented only when the frame clock
# arms one, with path tessellations, shaped text and writer-layer caches by content key and
# two-stop gradients through the GPUI patch's exact gradient mode. It draws canvas text, so the
# text lint reads it.
[package.metadata.deep]
canvas_text = true

[[bin]]
name = "deep-canvas-render"
path = "src/main.rs"

[dependencies]
deep-canvas-marks = { path = "../deep-canvas-marks" }
deep-canvas-motion = { path = "../deep-canvas-motion" }
deep-replica = { path = "../deep-replica" }
deep-text = { path = "../deep-text" }
deep-text-gpui = { path = "../deep-text-gpui" }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "1676826d9d49b90f4d7b6808b69924f58796f6f1", features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

# The GPU ledger the GPUI patch adds to the Metal renderer: frame command buffers and their time.
[target.'cfg(target_os = "macos")'.dependencies]
gpui-pre-apple = "=0.3.9"
