[package]
name = "deep-logic"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Issue #531: the logic module (canvas primitives: Logic `logic@1`): a logic item's check, its
# steps at a fixed rate on sandbox@1's rewritten bytes (#238), its regions, seeds, checkpoints,
# restores, traps by source line and logic.budget, and the web player's runtime for the same
# bytes; #532 adds bakes, goldens, logic.determinism, data assets and live seeks across frames
# (`wat` assembles logic.budget's calibration programs; `libc` reads thread CPU time). It runs the program in wasmtime, so like deep-sandbox-wasmtime it stays outside the
# canvas lint's scope: every value a check reads is what the rewritten program computes.
[dependencies]
deep-canvas = { path = "../deep-canvas" }
deep-canvas-sandbox = { path = "../deep-canvas-sandbox" }
# #194: logic.tuning moves a catalog's tuning rows in their table.layout@1 bytes.
deep-catalog = { path = "../deep-catalog" }
deep-sandbox-wasmtime = { path = "../deep-sandbox-wasmtime" }
wasmparser = { version = "=0.258.3", default-features = false, features = ["std", "validate", "features", "simd"] }
addr2line = { version = "=0.26.1", default-features = false }
gimli = { version = "=0.33.0", default-features = false, features = ["read", "std", "endian-reader"] }
base64 = "0.22"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11"
wat = "=1.263.0"
web-time = "=1.1.0"

# #172: the web player steps the same bytes on the browser's engine through deep-sandbox-wasmtime's
# web runner, and reads no thread CPU time there.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = { version = "=49.0.5", default-features = false, features = ["cranelift", "runtime", "std", "addr2line"] }
libc = "0.2"

[[bin]]
name = "deep-logic"
path = "src/main.rs"

# Issue #2662: the acceptance tests, written blind in tests/acceptance/2662.
[[test]]
name = "acceptance_2662_step_bytes"
path = "../../tests/acceptance/2662/step_bytes.rs"

[[test]]
name = "acceptance_2662_seek_compiles"
path = "../../tests/acceptance/2662/seek_compiles.rs"

[[test]]
name = "acceptance_2662_forks"
path = "../../tests/acceptance/2662/forks.rs"

[[test]]
name = "acceptance_2662_forks_planted"
path = "../../tests/acceptance/2662/forks_planted.rs"

[[test]]
name = "acceptance_2662_live_record"
path = "../../tests/acceptance/2662/live_record.rs"

[[test]]
name = "acceptance_2662_goldens"
path = "../../tests/acceptance/2662/goldens.rs"
