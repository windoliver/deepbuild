[package]
name = "deep-marks-gpui"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
rust-version = "1.95"

# Issue #380: the canvas's 2D marks where GPUI draws. A path's fill or stroke is tessellated by
# deep-canvas-marks and its triangles painted as one GPUI path, so the app's lines and
# deep-canvas-render's paths draw through the canvas's primitives, never a view's own path.
[dependencies]
deep-canvas-marks = { path = "../deep-canvas-marks" }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "1676826d9d49b90f4d7b6808b69924f58796f6f1" }
