[package]
name = "deep-replica"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
rust-version = "1.95"

# Issue #338: the replica, a headless copy of the app on a virtual clock that checks run in, and
# the live capture that reads the real app's accessibility tree. Both are tools beside the app,
# so the app binary carries no test support.
[dependencies]
deep-app = { path = "../deep-app" }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "1676826d9d49b90f4d7b6808b69924f58796f6f1", features = ["test-support"] }
gpui-shell = { git = "https://github.com/longbridge/gpui-kit", rev = "1676826d9d49b90f4d7b6808b69924f58796f6f1", default-features = false, features = ["quickjs", "components"] }
serde_json = "1"

# The live capture asks AppKit for the window's accessibility children and their frames.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSWindow", "NSView", "NSResponder"] }

[[bin]]
name = "deep-replica"
path = "src/main.rs"

# Issue #806: the app's canvas panel, headless, connected to the hub as the app is.
[[bin]]
name = "deep-replica-canvas"
path = "src/canvas.rs"

[[bin]]
name = "deep-live"
path = "src/live.rs"

# AppKit needs the main thread for the offscreen Metal renderer, so no libtest harness; the
# suite prints libtest's result lines. Outside tests/ for the same reason as deep-app's screens.
[[test]]
name = "headless"
path = "headless.rs"
harness = false

# Issue #326, criterion group "panels": the acceptance tests written blind in
# tests/acceptance/326/panels. `acceptance_326_panels` holds the criteria; `..._planted` runs the
# wrong programs they name through the same judges. AppKit needs the main thread, so no harness.
[[test]]
name = "acceptance_326_panels"
path = "../../tests/acceptance/326/panels/panels.rs"
harness = false

[[test]]
name = "acceptance_326_panels_planted"
path = "../../tests/acceptance/326/panels/planted.rs"
harness = false

# Issue #326, criterion group "surfaces": notifications on the virtual clock and every row of States
# people see on every surface, written blind in tests/acceptance/326/surfaces. No harness, as above.
[[test]]
name = "acceptance_326_surfaces"
path = "../../tests/acceptance/326/surfaces/surfaces.rs"
harness = false
