[package]
name = "deep-typeset"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[dependencies]
mitex = { git = "https://github.com/mitex-rs/mitex", rev = "51f7210e026ab05d037125247e92d4d023d8a80d" }
# The spec mitex converts by, from its own prebuilt file, never regenerated by a typst found on PATH.
mitex-spec-gen = { git = "https://github.com/mitex-rs/mitex", rev = "51f7210e026ab05d037125247e92d4d023d8a80d", features = ["prebuilt"] }
serde_json = "1"
ttf-parser = "0.25"
typst = "=0.15.1"
typst-layout = "=0.15.1"
