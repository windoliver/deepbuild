[package]
name = "deep-text-gpui"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
rust-version = "1.95"

# Issue #390: the canvas's text where GPUI draws a 2D writer layer. A label is shaped once by
# deep-text, its glyphs rasterized into the canvas's atlas, and drawn through the GPUI patch's
# tinted mask sprite. Named deep-text* so scripts/text-lint.mjs reads every call here.
[dependencies]
deep-text = { path = "../deep-text" }
# #1479: glyph outlines flatten and bucket by zoom as any path does.
deep-canvas-marks = { path = "../deep-canvas-marks" }
# #1431: the text cache's gauges.
deep-canvas = { path = "../deep-canvas" }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "e97fe438129c5e4ccab504f2e6fafd9a4e396bba" }
