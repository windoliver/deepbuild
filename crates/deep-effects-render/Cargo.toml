[package]
name = "deep-effects-render"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
rust-version = "1.95"

# Issue #380: the effects module's render side on the GPU layer (#377). Each shipped operator's
# WGSL, which the core writes from its checked steps, is validated by naga with every check and
# no optional capability, compiled once per key, and run as a full-screen pass in its place in
# the frame: glow's mip chain, the ground grid, the shadow filter over the core's shadow map,
# sparks and the selection outline. Each pass is timed with wgpu-profiler.
[dependencies]
deep-canvas-effects = { path = "../deep-canvas-effects" }
deep-canvas-motion = { path = "../deep-canvas-motion" }
deep-gpu = { path = "../deep-gpu" }
deep-scene3d-render = { path = "../deep-scene3d-render" }
# Issue #1434 adds msl-out: a chrome effect's operator, written as Metal source for GPUI's renderer.
naga = { version = "30", default-features = false, features = ["wgsl-in", "msl-out"] }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"] }
wgpu-profiler = "0.28"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

# Issue #1312: criteria 1 and 2's acceptance tests, written blind in tests/acceptance/1312 (here, not in
# deep-canvas-effects, whose canvas lint scans only files inside the crate): the shipped particles
# operator on the CPU reference keeps a particle born inside emit.span alive until its life ends, on its own path.
[[test]]
name = "acceptance_1312"
path = "../../tests/acceptance/1312/operator.rs"
