[package]
name = "deep-canvas"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[package.metadata.deep]
# The lint lane's scope: this crate registers the document check, so what it computes a check reads
# (technical design: Seeded and replayable).
check_kinds = ["document.validate"]

[dependencies]
libm = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
unicode-normalization = "0.1"
