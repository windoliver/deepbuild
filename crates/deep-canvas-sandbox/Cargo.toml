[package]
name = "deep-canvas-sandbox"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Issue #238: the sandbox canvas module (canvas primitives: Logic: sandbox), `sandbox@1`: the logic
# subset's check, the rewrite with its fuel, stack and NaN rules, the trap kinds and the check-time
# runner's contract, shared by logic items, providers, validators and registry program entries. It
# parses and writes WebAssembly with the parser wasmtime 49.0.5 itself uses; the engine that runs
# the rewritten bytes is deep-sandbox-wasmtime in the app and the browser's own in the web player.
[dependencies]
deep-canvas = { path = "../deep-canvas" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
wasmparser = { version = "=0.258.3", default-features = false, features = ["std", "validate", "features", "simd"] }
wasm-encoder = { version = "=0.258.3", default-features = false, features = ["std", "wasmparser"] }

