[package]
name = "deep-synth-job"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Issue #204: a score's synth instrument rendered offline by score.render with the media module's
# own preset and voice code, built to wasm32 for the score tool (scripts/synth-wasm.mjs). Outside
# the canvas lint, since a wasm module's calls need a C ABI and raw memory.

[dependencies]
deep-canvas-media = { path = "../deep-canvas-media" }
serde_json = "1"
