[package]
name = "deep-canvas-scene3d"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
rust-version = "1.95"

# Issue #378: the scene3d canvas module's R2 subset. Its kinds (marks in 3D: boxes, cylinders,
# spheres, lines, points and text) register through the registry and seal (#305), and a
# document's 3D writer layers evaluate at t, in f64 through the ops module, into what the GPU
# layer draws: each layer's instance records, the camera's reversed-Z projection, the look's
# exposure and tone map, labels' glyphs in the core's glyph atlas (#381), and the 2D overlays
# anchored to 3D points.
# `deep-scene3d-render` draws it; nothing here touches the GPU.
[package.metadata.deep]
canvas_text = true

[dependencies]
deep-canvas = { path = "../deep-canvas" }
deep-canvas-motion = { path = "../deep-canvas-motion" }
deep-text = { path = "../deep-text" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
vello_cpu = { version = "0.3", default-features = false, features = ["std", "text", "f32_pipeline"] }
