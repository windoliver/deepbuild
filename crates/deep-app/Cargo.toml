[package]
name = "deep-app"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
# gpui-kit uses `std::hint::cold_path`, stable since 1.95.
rust-version = "1.95"

# Issue #358: `panel-check` and `panel-bench`, the headless check of an agent-built panel. Off in the shipping app,
# which then carries no test support.
[features]
panel-check = ["gpui-kit/test-support"]
# Issue #994: the wrong program AC3 names, in no shipped build: it posts and logs notified without checking the setting.
plant-posts-unchecked = []
# Issue #1141's wrong programs, in no shipped build: a fold that drops every ask.moot, and a reader that keeps every
# event and reads the record by walking them all.
plant-drops-close = []
plant-walks-events = []
# Issue #1172's wrong programs, in no shipped build (tests/acceptance/1172): the app opening the spike window with its
# 1,000 generated sessions and made-up count, Needs you rows that show each ask's handle, and a terminal tab that writes
# its rows with the chrome's text outside the cell grid.
plant-spike-window = ["spike"]
plant-handle-rows = []
plant-tab-text = []
# Issue #41's wrong program, in no shipped build (tests/acceptance/41/app): an app that takes every hub hello as covering
# it, so it calls methods the hub doesn't list.
plant-calls-unlisted = []
# Issue #1408: the wrong programs a test selects with DEEP_HUB_PLANT, read only in a build with this feature. A release
# build refuses it.
env-plants = []
# Issue #124's wrong session rows, in no shipped build: deep-drive turns one on when it's planted, for the UI check,
# through deep-replica's env-plants feature (#1662).
plant-row = []
# Issue #1454's wrong programs, in no shipped build (tests/acceptance/1454): a card that takes a press from no hardware as
# you, a page opened with no params, and an app that mounts every installed panel whatever its kit said.
plant-card-skips-confirm = []
plant-page-drops-param = []
plant-panel-skips-kit = []
# Issue #1454: a file stands in for the OS's prompt, in no shipped build: a test can't be you, and an environment variable
# in the shipped app would let an agent answer for you.
test-confirm = []
# Issue #1172: #337's spike window, in no shipped build: the suites that keep its proof build it, through the dev
# dependency on this crate below.
spike = []

# Issue #337: the gpui-kit spike. Pinned to one gpui-kit commit, since gpui-shell is at
# milestone M0 and unpublished. No `webview` feature: the app has no web view.
[dependencies]
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "1676826d9d49b90f4d7b6808b69924f58796f6f1" }
gpui-shell = { git = "https://github.com/longbridge/gpui-kit", rev = "1676826d9d49b90f4d7b6808b69924f58796f6f1", default-features = false, features = ["quickjs", "components"] }
# Issue #358: the switch, in vendor/quickjs-jit-runtime. The signed app has no allow-jit entitlement, so it denies itself native code too.
quickjs-jit-runtime = { git = "https://github.com/longbridge/quickjs-jit", rev = "96593cd7a54440ac060a391b8baea7e9a3cf1393" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Issue #390: the canvas's text (a label, a readout) shaped by deep-text and drawn from its atlas
# through the GPUI patch's mask sprite. The chrome keeps GPUI's own text, and the screens harness
# builds its headless context on the platform's text system, so this crate stays outside the
# canvas text lint's scope: its canvas text goes through deep-text-gpui, which is in it.
deep-text-gpui = { path = "../deep-text-gpui" }
# Issue #380: the session line is a stroke of the canvas's marks, painted by deep-marks-gpui.
deep-marks-gpui = { path = "../deep-marks-gpui" }
# Issue #326: the look's status map, which every surface draws a state with.
deep-canvas-marks = { path = "../deep-canvas-marks" }
# Issue #402: the cell grid's emulator and palette, whose screen the app paints row by row.
deep-canvas-cells = { path = "../deep-canvas-cells" }
# Issue #377: the GPU layer, whose views the window shows in place.
deep-gpu = { path = "../deep-gpu" }
# Issue #327: the image you attach is kept by its SHA-256; the click token is one too (the version already in the tree).
sha2 = "0.10"
# Issue #1454: the app signs its answers as the device you paired (the version already in the tree).
ed25519-dalek = "3"
# Issue #883: a notification gives the default's time as a clock time in your time zone (the version gpui already uses).
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# The menu-bar count: gpui-kit has no status item. Versions already in gpui's tree.
# Issue #339 adds the event monitor (NSEvent, block2), the screen-capture access calls and the
# one-frame capture (objc2-core-graphics), the cursor window's native move (raw-window-handle,
# NSWindow) and the frame's pixels as a gpui image (image).
# Issue #262 adds NSScreen, NSGraphics, CGDisplayConfiguration, CGSession, NSDictionary and NSValue: whether a
# window's display sleeps and whether the session is locked, for the views it reports shown.
# The frame's pixels as a gpui image (`show.rs`), on every platform the app builds on.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# Issue #79 adds NSData, NSImage, NSImageRep, NSBitmapImageRep and NSCell: the dock icon and the
# menu-bar template from the kit's bytes.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData", "NSGeometry", "NSError", "NSURL", "NSArray", "NSBundle", "NSEnumerator", "NSDictionary", "NSValue"] }
# Issue #883: `--notification-center` reads what Notification Center holds from the app (the version gpui uses).
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationRequest", "UNNotificationContent", "UNNotificationSettings"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "objc2-core-graphics", "block2", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSResponder", "NSEvent", "NSApplication", "NSWindow", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSCell", "NSScreen", "NSGraphics", "NSSound"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFBase", "CFCGTypes", "CFData", "CFDictionary", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColorSpace", "CGError", "CGEvent", "CGEventSource", "CGEventTypes", "CGWindow", "CGDirectDisplay", "CGImage", "CGDataProvider", "CGGeometry", "CGRemoteOperation", "CGDisplayConfiguration", "CGSession", "libc"] }
block2 = "0.6"
raw-window-handle = "0.6"
# Issue #105: the bug capture: ScreenCaptureKit's system picker, its stream and its recording
# output (one MP4), and the sample buffers its frames arrive in.
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "SCContentSharingPicker", "SCRecordingOutput", "SCShareableContent", "SCStream", "bitflags", "block2", "dispatch2", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMSampleBuffer"] }
# Issue #377: the GPUI patch's surface reports, which release a GPU-layer slot.
gpui-pre-apple = "=0.3.9"
# Issue #140: the color seam tags every Metal layer the app presents through, a surface wgpu
# configures among them (the versions already in the tree).
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "objc2-core-foundation", "objc2-core-graphics"] }
wgpu = { version = "30", default-features = false, features = ["std", "metal"] }
pollster = "0.4"

[dev-dependencies]
deep-app = { path = ".", features = ["spike"] }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "1676826d9d49b90f4d7b6808b69924f58796f6f1", features = ["test-support"] }

# Real pixels from GPUI's offscreen Metal renderer; AppKit needs the main thread, so no libtest
# harness. Outside tests/ because a [[test]] entry must find its file: preflight's perf run drops
# a change's own tests/ files, so this suite counts in its measured workload instead.
[[test]]
name = "screens"
path = "screens.rs"
harness = false

# Issue #402: the spike: a busy terminal's changes fed to the cell grid in the app, one frame each.
[[test]]
name = "spike_402"
path = "spike_402.rs"
harness = false

# Issue #34: the record reader's acceptance tests, written blind in tests/acceptance/34.
[[test]]
name = "acceptance_34"
path = "../../tests/acceptance/34/app/record_reader.rs"

# Issue #1141: the folded record reader's acceptance tests, written blind in tests/acceptance/1141. The memory test is
# a binary of its own, so its process holds the record reader and nothing another test allocated.
[[test]]
name = "acceptance_1141"
path = "../../tests/acceptance/1141/app/folded.rs"

[[test]]
name = "acceptance_1141_memory"
path = "../../tests/acceptance/1141/app/memory.rs"

# Issue #995: the canvas panel's acceptance test, written blind in tests/acceptance/995. A binary of its own, so its
# process holds the one panel and nothing another test allocated; it draws the panel in a headless window, and AppKit
# needs the main thread, so no libtest harness.
[[test]]
name = "acceptance_995"
path = "../../tests/acceptance/995/app/panel.rs"
harness = false
