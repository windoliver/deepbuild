[package]
name = "deep-app"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
# gpui-kit uses `std::hint::cold_path`, stable since 1.95.
rust-version = "1.95"

# Issue #337: the gpui-kit spike. Pinned to one gpui-kit commit, since gpui-shell is at
# milestone M0 and unpublished. No `webview` feature: the app has no web view.
[dependencies]
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "1676826d9d49b90f4d7b6808b69924f58796f6f1" }
gpui-shell = { git = "https://github.com/longbridge/gpui-kit", rev = "1676826d9d49b90f4d7b6808b69924f58796f6f1", default-features = false, features = ["quickjs", "components"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Issue #390: the canvas's text (a label, a readout) shaped by deep-text and drawn from its atlas
# through the GPUI patch's mask sprite. The chrome keeps GPUI's own text, and the screens harness
# builds its headless context on the platform's text system, so this crate stays outside the
# canvas text lint's scope: its canvas text goes through deep-text-gpui, which is in it.
deep-text-gpui = { path = "../deep-text-gpui" }
# Issue #380: the session line is a stroke of the canvas's marks, painted by deep-marks-gpui.
deep-marks-gpui = { path = "../deep-marks-gpui" }
# Issue #326: the look's status map, which every surface draws a state with.
deep-canvas-marks = { path = "../deep-canvas-marks" }
# Issue #377: the GPU layer, whose views the window shows in place.
deep-gpu = { path = "../deep-gpu" }

# The menu-bar count: gpui-kit has no status item. Versions already in gpui's tree.
# Issue #339 adds the event monitor (NSEvent, block2), the screen-capture access calls and the
# one-frame capture (objc2-core-graphics), the cursor window's native move (raw-window-handle,
# NSWindow) and the frame's pixels as a gpui image (image).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# Issue #79 adds NSData, NSImage, NSImageRep, NSBitmapImageRep and NSCell: the dock icon and the
# menu-bar template from the kit's bytes.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "objc2-core-graphics", "block2", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSResponder", "NSEvent", "NSApplication", "NSWindow", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSCell"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFCGTypes", "CFData"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGError", "CGEvent", "CGEventSource", "CGEventTypes", "CGWindow", "CGDirectDisplay", "CGImage", "CGDataProvider", "CGGeometry", "CGRemoteOperation", "libc"] }
block2 = "0.6"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
# Issue #377: the GPUI patch's surface reports, which release a GPU-layer slot.
gpui-pre-apple = "=0.3.9"

[dev-dependencies]
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "1676826d9d49b90f4d7b6808b69924f58796f6f1", features = ["test-support"] }

# Real pixels from GPUI's offscreen Metal renderer; AppKit needs the main thread, so no libtest
# harness. Outside tests/ because a [[test]] entry must find its file: preflight's perf run drops
# a change's own tests/ files, so this suite counts in its measured workload instead.
[[test]]
name = "screens"
path = "screens.rs"
harness = false

# Issue #34: the record reader's acceptance tests, written blind in tests/acceptance/34.
[[test]]
name = "acceptance_34"
path = "../../tests/acceptance/34/app/record_reader.rs"
