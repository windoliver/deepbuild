[package]
name = "deep-canvas-export"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Issue #162: the export module's Lottie writer and its `export` check kind (canvas primitives:
# Export: Lottie). Named deep-canvas* so the canvas lint reads it: every transcendental goes
# through deep-canvas's ops module on pinned libm.

[dependencies]
deep-canvas = { path = "../deep-canvas" }
deep-canvas-marks = { path = "../deep-canvas-marks" }
deep-canvas-motion = { path = "../deep-canvas-motion" }
deep-text = { path = "../deep-text" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
