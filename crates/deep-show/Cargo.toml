[package]
name = "deep-show"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
rust-version = "1.95"

# Issue #393: `deep-show`, the proof surface for deep_show and `deep show --check --snap`: a
# scenario of calls against the hub's canvas side (the agent's own writer layer stamped from its
# connection or the peer check, whole revisions with their diff, issues inlined up to the read
# cap, render-back snapshots of settled frames on the CPU through Vello CPU), and on macOS the
# window those calls leave, composed by band with the question card last through GPUI's offscreen
# Metal renderer. It draws canvas text, so the text lint reads it.
[package.metadata.deep]
canvas_text = true

[[bin]]
name = "deep-show"
path = "src/main.rs"

# Issue #305: the build set is a Cargo feature (one of core, r1, r2, full; full by default), and
# each test canvas module of the #305 acceptance README joins a test build under its own feature.
# Each set is a list of canvas modules (#388): core is text and look, r1 adds marks2d, data,
# graph, record, sheet and motion, r2 adds scene3d and effects, and full holds every one.
[features]
default = ["full"]
core = []
r1 = []
r2 = []
full = []
test-a = ["dep:deep-canvas-test-modules"]
test-b = ["dep:deep-canvas-test-modules"]
test-b-requires-a = ["dep:deep-canvas-test-modules"]
test-two-writers = ["dep:deep-canvas-test-modules"]
test-later-phase = ["dep:deep-canvas-test-modules"]
test-cycle = ["dep:deep-canvas-test-modules"]
test-missing-dep = ["dep:deep-canvas-test-modules"]
# Issue #371: a new release's stricter title rule, and a deprecated kind with its replacement.
test-title-cap = ["dep:deep-canvas-test-modules"]
test-deprecated = ["dep:deep-canvas-test-modules"]
# Issue #403: a test canvas module that registers a document check kind, and a build with the
# logic module left out of the full set's list.
test-check-kind = ["dep:deep-canvas-test-modules"]
test-leave-out-logic = []
# Issue #387: the test canvas modules of the #387 acceptance README. `test-accent`'s planted
# operator reads the look's accent role from a static, which the canvas lint keeps out of every
# deep-canvas* crate, so it lives in this binary.
test-accent = []
# Issue #857: `test.serial` (not thread-safe) and the planted `test.racy`, which touches a static.
test-threads = []
# Issue #855: a test canvas module whose frame-phase operator writes JSON, which the seal refuses;
# a build whose Debug text for every typed value differs; and a result digesting its Debug text.
test-json = []
test-debug-alt = []
test-debug-digest = []
test-peek = ["dep:deep-canvas-test-modules"]
test-up-1-0 = ["dep:deep-canvas-test-modules"]
test-up-1-1 = ["dep:deep-canvas-test-modules"]
test-nudge = ["dep:deep-canvas-test-modules"]
test-step = ["dep:deep-canvas-test-modules"]
test-step-renamed = ["dep:deep-canvas-test-modules"]
test-step-cycle = ["dep:deep-canvas-test-modules"]
test-scatter = ["dep:deep-canvas-test-modules"]
# Issue #488: a stepping module with checkpoints, and a module whose cache is keyed by frame
# number (the #488 acceptance README: The test canvas modules).
test-tick = ["dep:deep-canvas-test-modules"]
test-frame-cache = ["dep:deep-canvas-test-modules"]
# Issue #388: test builds that leave look, or text, out of the build set's list; the seal
# refuses each at startup, naming the module.
test-leave-out-look = []
test-leave-out-text = []
# Issue #138: the canvas conformance kit's test canvas modules (the #138 acceptance README: The
# test canvas modules), each a clean module or its planted twin, never in a shipped build.
test-kit = []
test-kit-crash = ["test-kit"]
test-kit-blind = ["test-kit"]
test-kit-blind-fixed = ["test-kit"]
test-kit-noisy = ["test-kit"]
test-kit-noisy-fixed = ["test-kit"]
test-kit-fixer = ["test-kit"]
test-kit-fixer-dangles = ["test-kit"]
test-kit-fixer-unproved = ["test-kit"]
test-kit-rogue = ["test-kit"]
test-kit-rogue-listed = ["test-kit"]
test-kit-carry = ["test-kit"]
test-kit-carry-drops-hits = ["test-kit"]
test-kit-tally = ["test-kit"]
test-kit-tally-keeps-occurrence = ["test-kit"]
test-kit-tally-skips-restored = ["test-kit"]
test-kit-cover = ["test-kit"]
test-kit-cover-fixed = ["test-kit"]
test-kit-snap = ["test-kit"]
test-kit-snap-off = ["test-kit"]
test-kit-glyphs = ["test-kit"]
test-kit-glyphs-no-box = ["test-kit"]
test-kit-keys = ["test-kit"]
test-kit-keys-kept-index = ["test-kit"]
test-kit-formula = ["test-kit"]
test-kit-gpu-pass = ["test-kit"]
test-kit-gpu-pass-shifted = ["test-kit"]
test-kit-gpu-pass-cpu-ref-fails = ["test-kit"]
test-kit-sneak = ["test-kit"]
test-kit-order = ["test-kit"]
test-kit-mig-1 = ["test-kit"]
test-kit-mig-2 = ["test-kit"]
test-kit-mig-2-moves = ["test-kit"]
test-kit-mig-2-overflow = ["test-kit"]
test-kit-loose = ["test-kit"]
test-kit-selfish = ["test-kit"]
test-kit-selfish-analytic = ["test-kit"]

# Issue #140: the window seam's test backend, which declares no occlusion report.
test-window = []

[dependencies]
deep-canvas = { path = "../deep-canvas" }
deep-canvas-test-modules = { path = "../deep-canvas-test-modules", optional = true }
deep-canvas-marks = { path = "../deep-canvas-marks" }
deep-canvas-graph = { path = "../deep-canvas-graph" }
deep-canvas-record = { path = "../deep-canvas-record" }
deep-canvas-sheet = { path = "../deep-canvas-sheet" }
# Issue #402: the cells canvas module, in the r2 build set and up, and its terminal emulator.
deep-canvas-cells = { path = "../deep-canvas-cells" }
deep-canvas-motion = { path = "../deep-canvas-motion" }
deep-canvas-scene3d = { path = "../deep-canvas-scene3d" }
# Issue #380: the shipped effects module, in R2's build set beside scene3d.
deep-canvas-effects = { path = "../deep-canvas-effects" }
# Issue #140: the platform seams and their conformance suites.
deep-canvas-seams = { path = "../deep-canvas-seams" }
deep-gpu = { path = "../deep-gpu" }
deep-scene3d-render = { path = "../deep-scene3d-render" }
deep-marks-vello = { path = "../deep-marks-vello" }
deep-text = { path = "../deep-text" }
# Issue #402: a terminal's PTY (openpty, login_tty, the window size) and stopping what serve
# started, by PID; already in the lockfile.
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
vello_cpu = { version = "0.3", default-features = false, features = ["std", "text", "f32_pipeline"] }
# Issue #138: the kit's headless backend (wgpu's noop) and its GPU backend.
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "noop"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "noop", "metal"] }
deep-replica = { path = "../deep-replica" }
deep-text-gpui = { path = "../deep-text-gpui" }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "1676826d9d49b90f4d7b6808b69924f58796f6f1", features = ["test-support"] }
