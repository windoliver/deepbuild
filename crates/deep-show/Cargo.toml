[package]
name = "deep-show"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
rust-version = "1.95"

# Issue #393: `deep-show`, the proof surface for deep_show and `deep show --check --snap`: a
# scenario of calls against the hub's canvas side (the agent's own writer layer stamped from its
# connection or the peer check, whole revisions with their diff, issues inlined up to the read
# cap, render-back snapshots of settled frames on the CPU through Vello CPU), and on macOS the
# window those calls leave, composed by band with the question card last through GPUI's offscreen
# Metal renderer. It draws canvas text, so the text lint reads it.
[package.metadata.deep]
canvas_text = true

[[bin]]
name = "deep-show"
path = "src/main.rs"

# Issue #305: the build set is a Cargo feature (one of core, r1, r2, full; full by default), and
# each test canvas module of the #305 acceptance README joins a test build under its own feature.
# Each set is a list of canvas modules (#388): core is text and look, r1 adds marks2d, data,
# graph, record, sheet and motion, r2 adds scene3d and effects, and full holds every one.
[features]
default = ["full"]
core = []
r1 = []
r2 = []
full = []
test-a = ["dep:deep-canvas-test-modules"]
test-b = ["dep:deep-canvas-test-modules"]
test-b-requires-a = ["dep:deep-canvas-test-modules"]
test-two-writers = ["dep:deep-canvas-test-modules"]
test-later-phase = ["dep:deep-canvas-test-modules"]
test-cycle = ["dep:deep-canvas-test-modules"]
test-missing-dep = ["dep:deep-canvas-test-modules"]
# Issue #371: a new release's stricter title rule, and a deprecated kind with its replacement.
test-title-cap = ["dep:deep-canvas-test-modules"]
test-deprecated = ["dep:deep-canvas-test-modules"]
# Issue #403: a test canvas module that registers a document check kind, and a build with the
# logic module left out of the full set's list.
test-check-kind = ["dep:deep-canvas-test-modules"]
# Issue #408: a test canvas module whose kind's items contribute glyph boxes to the core's
# glyph-box array, and draw nothing else.
test-glyph-label = ["dep:deep-canvas-test-modules"]
test-leave-out-logic = []
# Issue #489: the full set without the data module, so motion@1's digest is compared without it.
test-leave-out-data = []
# Issue #490: the full set without the motion module; the planted layout that declares ease@1 in
# the motion module; and the planted opening that renumbers ease@1's entries.
test-leave-out-motion = []
test-ease-in-motion = []
test-ease-renumbered = []
# Issue #493: the planted layout that registers camera@1 in the scene3d module, not the core.
test-camera-in-scene3d = []
# Issue #238: the sandbox module's test builds (the #238 acceptance README: Test features of
# deep-show): the full set without sandbox; test.mesh, whose kind takes a provider's mesh at check;
# test.prog, whose registry packs fill with programs; a planted sandbox module that requires logic;
# and the test implementation sandbox.alt, pinning another wasmtime 49.0 patch.
test-leave-out-sandbox = []
test-mesh-item = ["dep:deep-canvas-test-modules"]
test-prog-registry = ["dep:deep-canvas-test-modules"]
test-sandbox-needs-logic = []
test-sandbox-alt = []
# Issue #387: the test canvas modules of the #387 acceptance README. `test-accent`'s planted
# operator reads the look's accent role from a static, which the canvas lint keeps out of every
# deep-canvas* crate, so it lives in this binary.
test-accent = []
# Issue #857: `test.serial` (not thread-safe) and the planted `test.racy`, which touches a static.
test-threads = []
# Issue #411: `test.machines`, whose GPU operators write a float array and an exact one, read back
# by its check kinds.
test-machines = ["dep:deep-effects-render"]
# Issue #855: a test canvas module whose frame-phase operator writes JSON, which the seal refuses;
# a build whose Debug text for every typed value differs; and a result digesting its Debug text.
test-json = []
test-debug-alt = []
test-debug-digest = []
test-peek = ["dep:deep-canvas-test-modules"]
# Issue #412: the #412 acceptance README's test canvas modules: a preview kind, a registry of cue
# kinds with the cue list that plays it (pop_in's default span 0.5 s, or 0.8 s), the ring at
# fixture digests A and B, and a kind whose one-liner overruns the sheet.
test-preview = ["dep:deep-canvas-test-modules"]
test-cue = ["dep:deep-canvas-test-modules"]
test-cue-span = ["dep:deep-canvas-test-modules"]
test-ring-a = ["dep:deep-canvas-test-modules"]
test-ring-b = ["dep:deep-canvas-test-modules"]
test-sheet-wordy = ["dep:deep-canvas-test-modules"]
test-up-1-0 = ["dep:deep-canvas-test-modules"]
test-up-1-1 = ["dep:deep-canvas-test-modules"]
test-nudge = ["dep:deep-canvas-test-modules"]
test-step = ["dep:deep-canvas-test-modules"]
test-step-renamed = ["dep:deep-canvas-test-modules"]
test-step-cycle = ["dep:deep-canvas-test-modules"]
test-scatter = ["dep:deep-canvas-test-modules"]
# Issue #488: a stepping module with checkpoints, and a module whose cache is keyed by frame
# number (the #488 acceptance README: The test canvas modules).
test-tick = ["dep:deep-canvas-test-modules"]
test-frame-cache = ["dep:deep-canvas-test-modules"]
# Issue #497: a module stepping at its item's step_rate into a held array.
test-held = ["dep:deep-canvas-test-modules"]
# Issue #388: test builds that leave look, or text, out of the build set's list; the seal
# refuses each at startup, naming the module.
test-leave-out-look = []
test-leave-out-text = []
# Issue #138: the canvas conformance kit's test canvas modules (the #138 acceptance README: The
# test canvas modules), each a clean module or its planted twin, never in a shipped build.
test-kit = []
test-kit-crash = ["test-kit"]
test-kit-blind = ["test-kit"]
test-kit-blind-fixed = ["test-kit"]
test-kit-noisy = ["test-kit"]
test-kit-noisy-fixed = ["test-kit"]
test-kit-fixer = ["test-kit"]
test-kit-fixer-dangles = ["test-kit"]
test-kit-fixer-unproved = ["test-kit"]
test-kit-rogue = ["test-kit"]
test-kit-rogue-listed = ["test-kit"]
test-kit-carry = ["test-kit"]
test-kit-carry-drops-hits = ["test-kit"]
test-kit-tally = ["test-kit"]
test-kit-tally-keeps-occurrence = ["test-kit"]
test-kit-tally-skips-restored = ["test-kit"]
test-kit-cover = ["test-kit"]
test-kit-cover-fixed = ["test-kit"]
test-kit-snap = ["test-kit"]
test-kit-snap-off = ["test-kit"]
test-kit-glyphs = ["test-kit"]
test-kit-glyphs-no-box = ["test-kit"]
test-kit-keys = ["test-kit"]
test-kit-keys-kept-index = ["test-kit"]
test-kit-formula = ["test-kit"]
test-kit-gpu-pass = ["test-kit"]
test-kit-gpu-pass-shifted = ["test-kit"]
test-kit-gpu-pass-cpu-ref-fails = ["test-kit"]
test-kit-sneak = ["test-kit"]
test-kit-order = ["test-kit"]
test-kit-mig-1 = ["test-kit"]
test-kit-mig-2 = ["test-kit"]
test-kit-mig-2-moves = ["test-kit"]
test-kit-mig-2-overflow = ["test-kit"]
test-kit-loose = ["test-kit"]
test-kit-selfish = ["test-kit"]
test-kit-selfish-analytic = ["test-kit"]

# Issue #140: the window seam's test backend, which declares no occlusion report.
test-window = []

# Issue #185: the test interface test.sim@1's implementations A and B, B's variants (an array's
# type or name changed, a planted false bit, a planted answer 2% off), test.sim@1's behavior part,
# test module c that reads B's private array, and a second GPU backend beside the shipped one.
# Issue #418: the look module's implementation replaced by a planted one whose finish at identity
# moves a value (tests/acceptance/418/README.md: The look@1 kit).
test-look-finish-off = []
# Issue #399: the data, graph and vector modules' implementations each replaced by a planted one
# (tests/acceptance/399/README.md: The kits: deep-show): an m4 that drops each column's last row,
# a layered layout that breaks a tie by registration order, and currentColor drawn in ink.
test-data-m4-drops-last = []
test-graph-tie-by-registration = []
test-vector-currentcolor-ink = []
test-sim = ["dep:deep-canvas-test-modules"]
test-sim-a = ["test-sim"]
test-sim-b = ["test-sim"]
test-sim-b-f64 = ["test-sim"]
test-sim-b-private-renamed = ["test-sim"]
test-sim-b-public-renamed = ["test-sim"]
test-sim-b-false-bit = ["test-sim"]
test-sim-b-off = ["test-sim"]
test-sim-behavior = ["test-sim"]
test-sim-c = ["test-sim"]
test-gpu-second-backend = []
# Issue #1920: A and B at version 1.0.1 and B with its pin's feature changed, each built in its
# implementation's place, and the full set with the physics module's rapier3d pin moved one patch
# (tests/acceptance/1920/README.md: Names this suite chooses).
test-sim-a-1-0-1 = ["test-sim"]
test-sim-b-1-0-1 = ["test-sim"]
test-sim-b-pin-feature = ["test-sim"]
test-physics-rapier-patch = []
# Issue #421: a planted implementation of scene3d@1, declared bit, whose light policy breaks a tie
# by registration order instead of by ID; the kit fails it and a release build refuses it.
test-scene3d-tie-by-order = []
# Issue #443: the full set without the vector module, and a planted scene3d whose extrude reads
# vector@1's items itself (an operator reading vector's array), an edge the seal refuses.
test-leave-out-vector = []
test-scene3d-reads-vector = []
# Issue #200: the test canvas modules of the #200 acceptance README, the build without effects,
# and the planted layout in which the effects module fills the op table's base steps.
test-mark = ["dep:deep-canvas-test-modules"]
# Issue #397: `test.columns`, which fills the core's `column.source@1` with `test.column.big`.
test-column-source = ["dep:deep-canvas-test-modules"]
test-mark-dot-9 = ["dep:deep-canvas-test-modules"]
test-mark-no-planted = ["dep:deep-canvas-test-modules"]
test-mark-no-since = ["dep:deep-canvas-test-modules"]
test-mark-dot-twice = ["dep:deep-canvas-test-modules"]
test-mark-binds-author = ["dep:deep-canvas-test-modules"]
test-mark-schema-changed = ["dep:deep-canvas-test-modules"]
test-mark-v2 = ["dep:deep-canvas-test-modules"]
test-mode-closed = ["dep:deep-canvas-test-modules"]
test-mode-registry = ["dep:deep-canvas-test-modules"]
test-mode-renumbered = ["dep:deep-canvas-test-modules"]
test-fill-a = ["dep:deep-canvas-test-modules"]
test-fill-b = ["dep:deep-canvas-test-modules"]
test-fill-b-part = ["dep:deep-canvas-test-modules"]
test-fill-c = ["dep:deep-canvas-test-modules"]
test-gpustep = ["dep:deep-canvas-test-modules"]
test-gpustep-no-fixture = ["dep:deep-canvas-test-modules"]
test-gpustep-no-twin = ["dep:deep-canvas-test-modules"]
test-rules-shared = ["dep:deep-canvas-test-modules"]
test-rules-isolated = ["dep:deep-canvas-test-modules"]
test-registries-load = ["dep:deep-canvas-test-modules"]
test-leave-out-effects = []
# Issue #499: a build without the media module; the test module that probes an asset through the
# decode worker, and its planted twin that calls through media; the planted media@1 whose reverb
# checkpoint leaves out its tail.
test-leave-out-media = []
test-probe = ["dep:deep-canvas-test-modules"]
test-probe-via-media = ["dep:deep-canvas-test-modules"]
test-media-checkpoint-without-tail = []
# Issue #501: the test module that fills `export.target@1` with `raw`; its planted twin whose
# target reads itself back; the planted layout that declares the registry in media's crate.
test-export-target = ["dep:deep-canvas-test-modules"]
test-export-target-self-read = ["dep:deep-canvas-test-modules"]
test-export-target-in-media = []
# #308: the full set without the input module, and the test control kind test.dial.
test-leave-out-input = []
test-control-kind = []
test-steps-in-effects = []

[dependencies]
deep-canvas = { path = "../deep-canvas" }
# Issue #1486: the one image service: still pictures drawn at their levels.
deep-images = { path = "../deep-images" }
deep-canvas-test-modules = { path = "../deep-canvas-test-modules", optional = true }
deep-canvas-marks = { path = "../deep-canvas-marks" }
deep-canvas-graph = { path = "../deep-canvas-graph" }
deep-canvas-record = { path = "../deep-canvas-record" }
deep-canvas-sheet = { path = "../deep-canvas-sheet" }
# Issue #402: the cells canvas module, in the r2 build set and up, and its terminal emulator.
deep-canvas-cells = { path = "../deep-canvas-cells" }
deep-canvas-vector = { path = "../deep-canvas-vector" }
deep-canvas-motion = { path = "../deep-canvas-motion" }
# Issue #308: the input module, controls and control@1, in the full build set.
deep-canvas-input = { path = "../deep-canvas-input" }
deep-canvas-scene3d = { path = "../deep-canvas-scene3d" }
# Issue #499: the media module, media@1; the logic module's world, which a live play steps on the
# transport's clock.
deep-canvas-media = { path = "../deep-canvas-media" }
deep-logic = { path = "../deep-logic" }
# Issue #1920: the physics module, physics@1, in the full build set, on the Rapier backend whose
# resolved pins its manifest names.
deep-canvas-physics = { path = "../deep-canvas-physics" }
deep-physics-rapier = { path = "../deep-physics-rapier" }
# Issue #380: the shipped effects module, in R2's build set beside scene3d.
deep-canvas-effects = { path = "../deep-canvas-effects" }
deep-canvas-sandbox = { path = "../deep-canvas-sandbox" }
# Issue #453: the loop canvas module (geometry.shading), in the full build set.
deep-canvas-loop = { path = "../deep-canvas-loop" }
deep-sandbox-wasmtime = { path = "../deep-sandbox-wasmtime" }
# Issue #140: the platform seams and their conformance suites.
deep-canvas-seams = { path = "../deep-canvas-seams" }
# Issue #498: the decode worker and the encode tool, which this binary's copies run as.
deep-codecs = { path = "../deep-codecs" }
# Issue #309: the network seam's macOS backend and relay@1.
deep-relay = { path = "../deep-relay" }
deep-gpu = { path = "../deep-gpu" }
deep-effects-render = { path = "../deep-effects-render", optional = true }
deep-scene3d-render = { path = "../deep-scene3d-render" }
deep-marks-vello = { path = "../deep-marks-vello" }
deep-text = { path = "../deep-text" }
# Issue #402: a terminal's PTY (openpty, login_tty, the window size) and stopping what serve
# started, by PID; already in the lockfile.
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
# Issue #1897: the u8 pipeline too, so a cross-machine record drawn through it is real and refused.
vello_cpu ={ version = "0.3", default-features = false, features = ["std", "text", "f32_pipeline", "u8_pipeline"] }
# Issue #138: the kit's headless backend (wgpu's noop) and its GPU backend.
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "noop"] }

# Issue #1901: the build script's digest of the sources this binary is built from; already in the
# lockfile.
[build-dependencies]
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "noop", "metal"] }
deep-replica = { path = "../deep-replica" }
deep-text-gpui = { path = "../deep-text-gpui" }
# Issue #854: the GPU ledger the GPUI patch adds to the Metal renderer, for a settled frame's GPU time.
gpui-pre-apple = "=0.3.9"
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "1676826d9d49b90f4d7b6808b69924f58796f6f1", features = ["test-support"] }
# Issue #140: `deep-show live`'s options also read the GPUI patch's presentation feedback, and
# the window's occlusion state and accessibility tree through AppKit; all already in the lockfile.
objc2 = "0.6"
raw-window-handle = "0.6"
# Issue #1551: a still window stops its display link. The vendored gpui-pre-macos's frame-link hook
# and plants, and the pointer move a `wake` posts at a point (NSPoint); both already in the lockfile.
gpui-pre-macos = "=0.3.9"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
