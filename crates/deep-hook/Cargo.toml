[package]
name = "deep-hook"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
deep-contracts = { path = "../deep-contracts" }

[features]
# A planted feature for #16's AC23: this build lists f_test among its features, sends it only when the hub
# lists it too, and sends it anyway when DEEP_HOOK_FORCE_F_TEST=1.
plant-f-test = []
# Planted wrong programs for #315's AC12 and AC13: print the hub's last line as it came; read with no
# deadline once connected; and cut the reply at the acknowledgement's deadline whatever hold it carries.
plant-print-reply = []
plant-connect-timeout-only = []
plant-fixed-deadline = []
# The planted wrong program for #316's AC8: match a written path only as written, resolving neither `..` nor links.
plant-paths-as-written = []
# The planted wrong program for #316's AC9: a shell reader that knows only the issue's own spellings.
plant-issue-spellings = []
# The planted wrong programs for #304: a rule compiled in that reads no rules.json entry (AC1), and a `counts:` class
# read only for the tools deep-hook reads itself (AC5).
plant-compiled-rule = []
plant-listed-kinds-only = []
# The planted wrong program for #1097's AC4: a reader that reads a program the line computes as no program at all.
plant-computed-misses = []
# Issue #1408: the wrong programs a test selects with DEEP_HUB_PLANT, read only in a build with this feature. A release
# build refuses it, so no shipped hook reads the variable.
env-plants = []
