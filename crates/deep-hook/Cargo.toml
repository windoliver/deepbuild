[package]
name = "deep-hook"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
deep-contracts = { path = "../deep-contracts" }

[features]
# A planted feature for #16's AC23: this build lists f_test among its features, sends it only when the hub
# lists it too, and sends it anyway when DEEP_HOOK_FORCE_F_TEST=1.
plant-f-test = []
# Planted wrong programs for #315's AC12 and AC13: print the hub's last line as it came; read with no
# deadline once connected; and cut the reply at the acknowledgement's deadline whatever hold it carries.
plant-print-reply = []
plant-connect-timeout-only = []
plant-fixed-deadline = []
