# The only patches (#338 checks the manifests for a [patch] table): gpui-kit and gpui-shell come from
# upstream at a pinned commit, with no fork. From gpui-kit 0.8.1 gpui-shell takes QuickJS and its
# standard modules from the registry, so the `rquickjs` facade #337 routed here is gone (#3502).
[patch.crates-io]
# Issue #2359: upstream XML-range fix, without a Typst update (MIT OR Apache-2.0).
citationberg = { git = "https://github.com/typst/citationberg", rev = "06a591e2f237d25e1dfdedac3f3d1494c496c52d" }

# Issue #390: the GPUI patch (technical design: Conventions, "the GPUI patch ... adds a tinted mask
# sprite drawn from the core's glyph atlas"). vendor/gpui-pre is gpui-pre 0.3.14 from crates.io with
# `AtlasKey::Mask`, `Window::paint_mask_sprite` and `Window::remove_mask_page` added, each marked
# "DeepBuild patch". gpui-kit and gpui-shell still come from upstream, unforked.
# Issue #124 adds, for test support only, `Hitbox::element` and `Window::hits_at`: a replica asks the frame's own
# hit test what a pointer event would reach, and sends nothing.
gpui-pre = { path = "vendor/gpui-pre" }
# Issue #391: the GPUI patch's exact gradient mode (technical design: Conventions, "an exact
# gradient mode (no dither, the sRGB curve, premultiplied stops)"). vendor/gpui-pre-apple is
# gpui-pre-apple 0.3.14 from crates.io with `ColorSpace::OklabExact` drawn by its Metal shader,
# each change marked "DeepBuild patch"; the variant itself is in vendor/gpui-pre's color.rs.
# Issue #377 adds the GPU layer's handoff to it: BGRA surfaces composited premultiplied, and
# `gpu_surfaces`, which reports the surfaces each frame command buffer samples and its completion.
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
# Issue #1477: AccessKit's macOS adapter gives a row its AXIndex from the row index, so VoiceOver reads a long
# table's rows by number. vendor/accesskit_macos is accesskit_macos 0.26.3 with `accessibilityIndex` added, marked
# "DeepBuild patch".
accesskit_macos = { path = "vendor/accesskit_macos" }
# Issue #1551: a still window stops its display link. vendor/gpui-pre-macos is gpui-pre-macos 0.3.14
# from crates.io, which pauses a still window's Metal display link itself (#3502); what we carry on it
# is the hook that hears each request-frame callback, a screen change that leaves a still window
# alone, and the planted twins.
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
# Issue #503: our own Vorbis decoder decodes within -90 dBFS of FFmpeg's decode on macOS.
# vendor/symphonia-codec-vorbis is symphonia-codec-vorbis 0.6.1 from crates.io whose inverse coupling
# takes a magnitude of +0.0 down the positive branch, as FFmpeg's arm64 decode does, marked
# "DeepBuild patch".
symphonia-codec-vorbis = { path = "vendor/symphonia-codec-vorbis" }
# Issue #358: the panel host's JIT switch (technical design: Decided, "Where agent-built panels run").
# vendor/quickjs-jit-runtime is that crate at the release gpui-shell asks for, 0.14.1, with
# `deny_native_code` added, marked "DeepBuild patch". It replaces this one crate; gpui-kit and
# gpui-shell stay upstream, unforked.
quickjs-jit-runtime = { path = "vendor/quickjs-jit-runtime" }
# Issue #2359: the panel's crypto module on final RSA. From gpui-kit 0.8.1 that module is in
# quickjs-jit-stdlib, which asks for an RSA release candidate; vendor/quickjs-jit-stdlib is 0.14.1 from
# crates.io with final RSA's feature and PKCS#1 type names (#3502), marked "DeepBuild patch".
quickjs-jit-stdlib = { path = "vendor/quickjs-jit-stdlib" }

# Issue #2359: migrate MiTeX's reader and compiled-in command archive together to rkyv 0.8.
# Only these Apache-2.0 crates change; the parser/converter and Typst stay at their pins.
[patch."https://github.com/mitex-rs/mitex"]
mitex-spec = { path = "vendor/mitex-spec" }
mitex-spec-gen = { path = "vendor/mitex-spec-gen" }

# Issue #449: an x86_64 build, the other machine a check runs under Rosetta 2, links CoreMedia for
# Rust's x86_64 deployment target (macOS 10.12) through the Swift overlay
# @rpath/libswiftCoreMedia.dylib, which macOS keeps in /usr/lib/swift; this rpath finds it there.
# Only x86_64 builds read it, so an arm64 build is unchanged.
[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-rpath,/usr/lib/swift"]
