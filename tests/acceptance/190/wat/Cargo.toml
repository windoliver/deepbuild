# The #190 acceptance suite's own fixture assembler (from #532's): WebAssembly text to bytes (the `wat`
# crate), and with --object a relocatable object as the WebAssembly tool conventions' Linking.md lays one
# out (README: Relocatable objects). Each output is validated by `wasmparser`, an object's `linking` and
# `reloc.CODE` sections read back through `wasmparser`'s own readers. Test tooling only, outside the
# workspace (the empty [workspace] table) with its own lockfile; it shares no code with the linker under test.
[package]
name = "acceptance-190-wat"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[[bin]]
name = "acceptance-190-wat"
path = "src/main.rs"

[dependencies]
wat = "=1.263.0"
wasmparser = "=0.263.0"

[workspace]
