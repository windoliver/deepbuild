# #2324 AC1's planted lock: the engine's entry of Cargo.lock as the base holds it, moved to 49.0.4 (its checksum line
# left out: this text is only ever read by the suite's lock check, never by cargo). 49.0.4 holds the Oct 14 and Oct 19
# fixes and none of the three published on Oct 29.
version = 4

[[package]]
name = "wasmtime"
version = "49.0.4"
source = "registry+https://github.com/rust-lang/crates.io-index"
dependencies = [
 "addr2line 0.26.1",
 "async-trait",
 "bitflags 2.13.2",
 "bumpalo",
 "cc",
 "futures",
 "gimli 0.33.0",
 "libc",
 "log",
 "mach2",
 "memfd",
 "object 0.40.0",
 "once_cell",
 "postcard",
 "pulley-interpreter",
 "rustix 1.1.5",
 "serde",
 "serde_derive",
 "smallvec",
 "target-lexicon",
 "wasmparser 0.258.3",
 "wasmtime-environ",
 "wasmtime-internal-core",
 "wasmtime-internal-cranelift",
 "wasmtime-internal-fiber",
 "wasmtime-internal-jit-debug",
 "wasmtime-internal-jit-icache-coherence",
 "wasmtime-internal-unwinder",
 "wasmtime-internal-versioned-export-macros",
 "windows-sys 0.61.2",
