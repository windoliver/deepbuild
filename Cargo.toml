[workspace]
members = ["crates/deep-contracts", "crates/deep-canvas-seams", "crates/deep-relay", "crates/deep-codecs", "crates/deep-hook", "crates/deep-app", "crates/deep-panel-host", "crates/deep-canvas", "crates/deep-gpu", "crates/deep-gpu-layer", "crates/deep-canvas-motion", "crates/deep-canvas-media", "crates/deep-canvas-physics", "crates/deep-physics-rapier", "crates/deep-motion", "crates/deep-canvas-input", "crates/deep-input", "crates/deep-canvas-scene3d", "crates/deep-scene3d-render", "crates/deep-canvas-effects", "crates/deep-effects-render", "crates/deep-canvas-marks", "crates/deep-canvas-drawn", "crates/deep-canvas-graph", "crates/deep-canvas-record", "crates/deep-canvas-sheet", "crates/deep-canvas-cells", "crates/deep-canvas-vector", "crates/deep-canvas-sandbox", "crates/deep-canvas-loop", "crates/deep-sandbox-wasmtime", "crates/deep-logic", "crates/deep-canvas-test-modules", "crates/deep-marks-render", "crates/deep-marks-gpui", "crates/deep-marks-vello", "crates/deep-show", "crates/deep-replica", "crates/deep-text", "crates/deep-text-gpui", "crates/deep-text-render", "crates/deep-images", "crates/deep-typeset"]
resolver = "2"

# Issue #390: the canvas's glyph rasterizer at release speed in dev builds, so the text tests
# (hundreds of 250 px glyphs) run in seconds, not minutes; nothing else is optimized.
[profile.dev.package.vello_cpu]
opt-level = 3
[profile.dev.package.vello_common]
opt-level = 3
[profile.dev.package.fearless_simd]
opt-level = 3

# Issue #96: the shared-document budgets (a patch applies in under 2 ms; merging two 10,000-item
# documents takes under 200 ms) are read off the dev binaries the acceptance tests run, so the
# kernel and the JSON, map and hash crates it spends its time in build at release speed there.
[profile.dev.package.deep-canvas]
opt-level = 3
# Issue #160: a path's ops rebuilt on change in under 1 ms (AC9), read off the dev binary.
[profile.dev.package.deep-canvas-marks]
opt-level = 3
# Issue #1486: a 1,000-tile grid's first screen in under 200 ms, read off the dev binary: the image
# service's levels and the decoders it makes them with build at release speed there.
[profile.dev.package.deep-images]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
# Issue #402: the terminal emulator a panel host feeds 50 MB of a program's output through.
[profile.dev.package.deep-canvas-cells]
opt-level = 3
# Issue #399: a 10,000-node graph laid out incrementally in under 50 ms per change, read off the
# dev binary.
[profile.dev.package.deep-canvas-graph]
opt-level = 3
# Issue #1436: the dev replica's pack check runs every chrome-fx@1 graph on the CPU interpreter,
# its fixture and 48 frames of its flash rate, and twenty-four twins' checks each do it again.
[profile.dev.package.deep-canvas-effects]
opt-level = 3
# Issue #499: the media module's mix, read off the dev binary: AC6 renders ten minutes of reverb
# three times.
[profile.dev.package.deep-canvas-media]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3
[profile.dev.package.indexmap]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.unicode-normalization]
opt-level = 3

# Issue #377: the GPU layer's proof binary reads back, hashes and scans for the blank guard every
# 1936 × 1584 frame of runs 10,000 frames long, and its budgets (a 1 ms handoff at p95, 0.1 ms on
# the UI thread) are read off the dev binary the acceptance tests run.
[profile.dev.package.deep-gpu]
opt-level = 3
[profile.dev.package.deep-gpu-layer]
opt-level = 3
# Its window captures read 2000 × 1648 frames back through the GPUI patch's Metal renderer.
[profile.dev.package.gpui-pre-apple]
opt-level = 3
# Issue #386: a 10,000-item 3D document's frame (under 4 ms of CPU) and its check before it shows
# (under 50 ms) are read off the same dev binary; its motion program, its frame path, the scene's
# first evaluation and the renderer's record writes run there.
# Issue #238: rewriting a 1 MB program takes under 200 ms once at check, read off the dev
# `deep-sandbox` the acceptance tests run; the rewrite spends its time in its own pass, the parser
# and the encoder.
# Issue #2009: the Oracle lane runs Rapier's own long scenes (a 32 × 32 joint net for 4,000 steps,
# ten 10-box chains for 10,000) on the dev deep-physics the acceptance tests build, so Rapier and
# the math crates it steps in build at release speed there.
[profile.dev.package.rapier3d]
opt-level = 3
[profile.dev.package.parry3d]
opt-level = 3
[profile.dev.package.glam]
opt-level = 3
[profile.dev.package.glamx]
opt-level = 3
[profile.dev.package.nalgebra]
opt-level = 3
[profile.dev.package.simba]
opt-level = 3
[profile.dev.package.deep-canvas-sandbox]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3
[profile.dev.package.wasm-encoder]
opt-level = 3
[profile.dev.package.deep-canvas-motion]
opt-level = 3
[profile.dev.package.deep-canvas-scene3d]
opt-level = 3
[profile.dev.package.deep-scene3d-render]
opt-level = 3
# Issue #124: a replica's budgets (an action's round trip under 50 ms plus its wait, a 2,000-node snapshot under
# 20 ms) are read off the dev `deep-drive` the acceptance tests run, and a replica's frame spends its time in GPUI's
# layout and paint, a panel's script VM and the path tessellator.
[profile.dev.package.deep-replica]
opt-level = 3
[profile.dev.package.gpui-pre]
opt-level = 3
[profile.dev.package.gpui-base]
opt-level = 3
[profile.dev.package.gpui-shell]
opt-level = 3
[profile.dev.package.taffy]
opt-level = 3
[profile.dev.package.lyon_tessellation]
opt-level = 3
[profile.dev.package.quickjs-jit-sys]
opt-level = 3
[profile.dev.package.quickjs-jit-core]
opt-level = 3
