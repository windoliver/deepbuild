const pass = (ok, yes = 'PASS', no = 'FAIL') => ok ? '<span class="ok">✓ ' + yes + '</span>' : '<span class="no">✗ ' + no + '</span>';
const label = (row) => row ? row.replace('_', ' ') : 'no row';
const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);

/** A tree diagram of a step: each node in the tree, its row, and the total mods.tree read beside what the rule gives. */
function tree(shape, step, stat, base, opts = {}) {
  const live = shape.filter((n) => n.live);
  const kids = (p) => live.filter((n) => n.parent === p).map((n) => n.n);
  const W = 104, H = 50, GX = 12, GY = 34, pos = {};
  let x = 0;
  const place = (n, d) => { const k = kids(n); if (!k.length) { pos[n] = { x: x, d }; x += W + GX; return pos[n].x; }
    const xs = k.map((c) => place(c, d + 1)); pos[n] = { x: (xs[0] + xs[xs.length - 1]) / 2, d }; return pos[n].x; };
  for (const r of kids(-1)) { place(r, 0); x += 18; }
  const depth = Math.max(...Object.values(pos).map((p) => p.d)) + 1;
  const width = x - GX - 18, height = depth * (H + GY) - GY;
  const read = {}, want = {};
  step.at.forEach((a, i) => { if (a.stat === stat) { read[a.node] = step.read[i]; want[a.node] = step.expected[i]; } });
  let s = '<svg viewBox="-4 -4 ' + (width + 8) + ' ' + (height + 8) + '" width="100%" style="max-height:' + (opts.max || 330) + 'px">';
  for (const n of live) if (n.parent >= 0 && pos[n.parent]) {
    const a = pos[n.parent], b = pos[n.n];
    s += '<path d="M' + (a.x + W / 2) + ' ' + (a.d * (H + GY) + H) + ' V' + (b.d * (H + GY) - GY / 2) + ' H' + (b.x + W / 2) + ' V' + (b.d * (H + GY)) + '" fill="none" stroke="var(--axis)" stroke-width="1.5"/>';
  }
  for (const n of live) {
    const p = pos[n.n], X = p.x, Y = p.d * (H + GY), r = read[n.n], w = want[n.n], b0 = base[n.n][opts.statName];
    const raised = r !== undefined && r !== b0, wrong = r !== w, hi = (opts.highlight || []).includes(n.n);
    const stroke = wrong ? 'var(--bad)' : raised ? 'var(--s1)' : 'var(--ring)';
    s += '<g data-tip="node ' + n.n + ' (' + label(n.row) + '): base ' + b0 + ', mods.tree read ' + r + ', the rule gives ' + w + '">';
    s += '<rect x="' + X + '" y="' + Y + '" width="' + W + '" height="' + H + '" rx="7" fill="' + (raised ? '#e8f1fc' : '#fff') + '" stroke="' + stroke + '" stroke-width="' + (wrong || raised || hi ? 2 : 1) + '"/>';
    s += '<text x="' + (X + 8) + '" y="' + (Y + 16) + '" font-size="11.5" fill="var(--ink2)">' + n.n + ' · ' + label(n.row) + '</text>';
    s += '<text x="' + (X + 8) + '" y="' + (Y + 40) + '" font-size="19" font-weight="650" fill="var(--ink)">' + r + '</text>';
    if (wrong) s += '<text x="' + (X + W - 8) + '" y="' + (Y + 40) + '" font-size="12" text-anchor="end" fill="var(--bad)">✗ rule ' + w + '</text>';
    else if (raised) s += '<text x="' + (X + W - 8) + '" y="' + (Y + 40) + '" font-size="12" text-anchor="end" fill="var(--ink2)">base ' + b0 + '</text>';
    s += '</g>';
  }
  return s + '</svg>';
}
const allMatch = (bake) => bake.steps.every((s) => eq(s.read, s.expected));

// ---- the panels
const P = {};
P.summary = () => {
  const scenes = [D.archers.ref, D.stack.capped, D.stack.uncapped, D.side.ref, D.rounds.ref];
  const sceneTotals = scenes.reduce((n, b) => n + b.steps.reduce((m, s) => m + s.read.length, 0), 0);
  const twinsCaught = [!allMatch(D.archers.twin), D.stack.twin_uncapped.steps[0].read[0] === 17, D.seeded.stale.wrong.length > 0].filter(Boolean).length;
  const busiest = Math.max(...D.budget.steps.map((s) => s.fuel));
  return '<section class="panel" id="summary"><h1>#953 mods.lib@1: validation evidence</h1>' +
    '<p class="sub">Real <code>deep-logic</code> bakes at commit 0ae6fcd98 (PR #2953) on ' + D.host.platform + '/' + D.host.arch + ', ' + D.host.at.slice(0, 16).replace('T', ' ') + ' UTC. ' +
    'Each piece links the reference library <code>' + D.pack.ref + '</code> through <code>mods.lib@1</code>; every total it read is set beside the blind suite\'s brute-force recompute of the whole tree.</p>' +
    '<div class="tiles">' +
    '<div class="tile"><div class="big">' + fmt(D.seeded.ref.compared + sceneTotals) + '</div><div class="lab">totals read and compared</div></div>' +
    '<div class="tile"><div class="big">' + (D.seeded.ref.wrong.length + scenes.filter((b) => !allMatch(b)).length) + '</div><div class="lab">totals off the rule ' + pass(D.seeded.ref.wrong.length === 0 && scenes.every(allMatch), 'none') + '</div></div>' +
    '<div class="tile"><div class="big">' + twinsCaught + ' of 3</div><div class="lab">wrong libraries baked here, each caught ' + pass(twinsCaught === 3, 'all') + '</div></div>' +
    '<div class="tile"><div class="big">' + (busiest / D.budget.ceiling * 100).toFixed(1) + '%</div><div class="lab">of the step ceiling at its busiest (' + fmt(busiest) + ' of ' + fmt(D.budget.ceiling) + ' fuel)</div></div>' +
    '</div></section>';
};
P.archers = (k) => {
  const ks = k === undefined ? [0, 1] : [k];
  const notes = ['The item on holder A (node 1): its row, attack +2 to kind = archer, reaches A\'s archers 2, 3 and 5 (5 under 2): each reads 12. The swordsman and B\'s archer keep their base.',
    'The item moved to holder B (node 7), its row re-added with B as source: A\'s archers are back to 10, B\'s archer 8 reads 12.'];
  return '<section class="panel"><h2>Criterion 2: a filter on the receiving node, and an item that moves</h2><p class="sub">Attack totals. Blue: raised above the node\'s base. ' +
    (ks.length === 2 ? 'Top: before the move. Bottom: after it.' : notes[ks[0]]) + '</p><div>' +
    ks.map((s) => '<div>' + tree(D.archers.shapes[s], D.archers.ref.steps[s], 0, B.archers[s], { statName: 'attack', max: k === undefined ? 330 : 470 }) +
      '<div class="cap" style="margin-bottom:12px">Step ' + s + ': ' + D.archers.ref.steps[s].note + ' · ' + pass(eq(D.archers.ref.steps[s].read, D.archers.ref.steps[s].expected), 'every total equals the recompute') + '</div></div>').join('') + '</div></section>';
};
P.twin = () => {
  const t = D.archers.twin;
  return '<section class="panel"><h2>The wrong library is caught: filters tested on the source</h2><p class="sub">The blind suite\'s twin <code>mods_on_source@1</code> tests a row\'s filters on its source (the hero holder) instead of the receiving node, so no archer takes the +2. Red: a total off the rule.</p>' +
    tree(D.archers.shapes[0], t.steps[0], 0, B.archers[0], { statName: 'attack', max: 440 }) +
    '<div class="cap">' + pass(false, '', 'caught: ' + (t.wrong[0] || 'no difference found')) + '</div></section>';
};
P.side = () => '<section class="panel"><h2>Criterion 4: reach side</h2><p class="sub">Archer 2\'s row, morale +3 with reach side, raises every node under side red (1 to 6) and none of side blue\'s. Morale totals.</p>' +
  tree(D.side.shapes[0], D.side.ref.steps[0], 0, B.side[0], { statName: 'morale', max: 330 }) +
  '<div class="cap">' + pass(allMatch(D.side.ref), 'every total equals the recompute') + '</div></section>';
P.rounds = (k) => {
  const st = D.rounds.ref.steps;
  const W = 1040, x = (i) => 30 + i * 202;
  let s = '<svg viewBox="0 0 ' + W + ' 170" width="100%">';
  st.forEach((p, i) => {
    const on = k === undefined || i <= k, cur = k === i;
    s += '<g opacity="' + (on ? 1 : 0.25) + '"><rect x="' + (x(i) - 10) + '" y="20" width="188" height="96" rx="8" fill="' + (cur ? '#e8f1fc' : '#fff') + '" stroke="' + (cur ? 'var(--s1)' : 'var(--ring)') + '" stroke-width="' + (cur ? 2 : 1) + '"/>' +
      '<text x="' + x(i) + '" y="44" font-size="12.5" fill="var(--ink2)">step ' + i + '</text>' +
      '<text x="' + x(i) + '" y="68" font-size="12" fill="var(--ink2)">' + p.note + '</text>' +
      '<text x="' + x(i) + '" y="104" font-size="26" font-weight="650">' + p.read[0] + '</text>' +
      '<text x="' + (x(i) + 168) + '" y="104" font-size="12" text-anchor="end" fill="' + (p.read[0] === p.expected[0] ? 'var(--goodtext)' : 'var(--bad)') + '">' + (p.read[0] === p.expected[0] ? '✓ rule ' : '✗ rule ') + p.expected[0] + '</text></g>';
  });
  s += '<text x="30" y="150" font-size="12" fill="var(--muted)">Each round is two turn boundaries, then the round\'s. A rounds row never counts a turn; it ends at the 3rd round\'s boundary.</text></svg>';
  return '<section class="panel"><h2>Criterion 4: a 3-round add of 5 to archer 2 (base 10)</h2><p class="sub">Present after rounds 1 and 2 and before round 3\'s boundary (15), gone after it (10).</p>' + s + '</section>';
};
P.stack = () => {
  const r = (b) => b.steps[0].read[0], e = (b) => b.steps[0].expected[0];
  const line = (name, b, note) => '<tr><td class="l">' + name + '</td><td>' + r(b) + '</td><td>' + e(b) + '</td><td class="l">' + (r(b) === e(b) ? '<span class="ok">✓ equal</span>' : '<span class="no">✗ off the rule</span>') + '</td><td class="l">' + note + '</td></tr>';
  return '<section class="panel"><h2>Criterion 3: the stacking order</h2><p class="sub">Archer 2, base 10, with add 5, percent 20 and cap 16 from hero 1: (10 + 5) × 1.2 = 18, capped to 16; rounded once at the end.</p>' +
    '<table><tr><th class="l">library</th><th>read</th><th>rule</th><th class="l"></th><th class="l"></th></tr>' +
    line('mods.tree, with the cap', D.stack.capped, '') + line('mods.tree, without the cap', D.stack.uncapped, '') +
    line('twin: percent before add', D.stack.twin_capped, 'the cap hides it') + line('twin: percent before add', D.stack.twin_uncapped, '10 × 1.2 + 5 = 17: caught') + '</table></section>';
};
P.seeded = () => {
  const w = D.seeded.stale.wrong[0];
  return '<section class="panel"><h2>Criterion 1: seeded trees against a brute-force recompute</h2><p class="sub">' + D.seeded.ref.trees + ' of the suite\'s seeded trees (up to 64 nodes, 128 rows), each edited 50 times, one edit a step, every total of every node read after each step.</p>' +
    '<table><tr><th class="l">library</th><th>totals compared</th><th>off the rule</th><th class="l">first difference</th></tr>' +
    '<tr><td class="l">mods.tree (reference)</td><td>' + fmt(D.seeded.ref.compared) + '</td><td>' + D.seeded.ref.wrong.length + '</td><td class="l">' + pass(D.seeded.ref.wrong.length === 0, 'none') + '</td></tr>' +
    '<tr><td class="l">twin: stale after a move</td><td>' + fmt(D.seeded.stale.compared) + '</td><td>' + D.seeded.stale.wrong.length + ' trees</td><td class="l" style="max-width:640px">' + (w ? '<span class="no">✗ caught:</span> ' + w.message + (w.previous !== null ? ' (its total before the edit: ' + w.previous + ')' : '') : 'none') + '</td></tr></table>' +
    '<p class="cap">The full criterion-1 test ran 1,000 such trees and passed in 616 s; the planted library mods.lib@1 ships (' + D.pack.planted[0].slice(0, 12) + '…) fails the interface\'s own seeded fixture the same way.</p></section>';
};
P.fuel = () => {
  const st = D.budget.steps, n = st.length, W = 1100, H = 260, L = 70, R = 140, T = 14, Bt = 30;
  const top = Math.max(D.budget.ceiling, ...st.map((s) => s.fuel)) * 1.08;
  const y = (v) => T + (H - T - Bt) * (1 - v / top), bw = (W - L - R) / n;
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%">';
  for (let g = 0; g <= top; g += 2_000_000) s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(g) + '" y2="' + y(g) + '" stroke="var(--grid)"/><text x="' + (L - 8) + '" y="' + (y(g) + 4) + '" font-size="11" text-anchor="end" fill="var(--muted)">' + (g / 1e6) + 'M</text>';
  st.forEach((p, i) => { const h = Math.max(1, y(0) - y(p.fuel)); s += '<rect data-tip="step ' + i + ': ' + p.note + ' · ' + fmt(p.fuel) + ' fuel' + (p.reads ? ' · 2,000 reads' : '') + '" x="' + (L + i * bw + 1) + '" y="' + (y(0) - h) + '" width="' + Math.max(1, bw - 2) + '" height="' + h + '" rx="' + Math.min(4, bw / 2 - 1) + '" fill="' + (p.reads ? 'var(--s1)' : 'var(--s2)') + '"/>'; });
  s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="var(--axis)"/>';
  for (const [v, t, dash] of [[D.budget.ceiling, 'step ceiling (figure, 60 Hz) ' + fmt(D.budget.ceiling), '0'], [D.budget.fuel_cap, 'item fuel budget ' + fmt(D.budget.fuel_cap), '5 4']]) {
    s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--ink)" stroke-dasharray="' + dash + '" stroke-width="1.2"/><text x="' + (W - R + 6) + '" y="' + (y(v) + 4) + '" font-size="11" fill="var(--ink2)">' + t.replace(/ (\d)/, '\n$1').split('\n').map((l, j) => '<tspan x="' + (W - R + 6) + '" dy="' + (j ? 13 : 0) + '">' + l + '</tspan>').join('') + '</text>';
  }
  s += '<text x="' + L + '" y="' + (H - 8) + '" font-size="11" fill="var(--muted)">step 0</text><text x="' + (W - R) + '" y="' + (H - 8) + '" font-size="11" text-anchor="end" fill="var(--muted)">step ' + (n - 1) + '</text></svg>';
  const reads = st.filter((p) => p.reads), busiest = Math.max(...reads.map((p) => p.fuel));
  const mb = typeof D.budget.merge_base === 'string' ? D.budget.merge_base : 'merge base ' + D.budget.merge_base.rev.slice(0, 9) + ': ' + D.budget.merge_base.nsPerFuelApp + ' ns per fuel';
  return '<section class="panel"><h2>Criterion 5: 2,000 reads a step over a 500-node tree, within the step ceiling</h2><p class="sub">Fuel of each step of the ' + D.budget.nodes + '-node, ' + fmt(D.budget.rows) + '-row tree in a figure piece. logic.budget on [app]: ' + pass(D.budget.verdict === 'PASS' && !D.budget.failures.length, 'PASS, no failure') + '; ' + mb + '; every total read equals the recompute: ' + pass(!D.budget.wrong.length, 'yes') + '.</p>' +
    '<div class="legend"><span><span class="sw" style="background:var(--s1)"></span>an edit, then 2,000 reads (60 steps)</span><span><span class="sw" style="background:var(--s2)"></span>building the tree: attaches, adds, first reads</span></div>' + s +
    '<p class="cap">The busiest edit step used ' + fmt(busiest) + ' fuel, ' + (busiest / D.budget.ceiling * 100).toFixed(1) + '% of the ceiling. Fuel counts instructions, so the same steps fit on any host.</p>' +
    '<details><summary class="cap">Table of every step</summary><table><tr><th>step</th><th class="l">what</th><th>fuel</th></tr>' + st.map((p, i) => '<tr><td>' + i + '</td><td class="l">' + p.note + '</td><td>' + fmt(p.fuel) + '</td></tr>').join('') + '</table></details></section>';
};

// ---- the page, or one frame of the walkthrough
const FRAMES = [() => P.summary(), () => P.archers(0), () => P.archers(1), () => P.twin(), () => P.side(),
  ...[0, 1, 2, 3, 4].map((k) => () => P.rounds(k)), () => P.stack(), () => P.seeded(), () => P.fuel()];
const f = new URLSearchParams(location.search).get('f');
const main = document.getElementById('main');
if (f !== null) {
  document.body.classList.add('frame');
  main.innerHTML = FRAMES[Number(f)]() + '<div class="foot">#953 mods.lib@1 · real deep-logic bakes, PR #2953 · frame ' + (Number(f) + 1) + ' of ' + FRAMES.length + '</div>';
} else {
  main.innerHTML = P.summary() + P.archers() + P.twin() + P.side() + P.rounds() + P.stack() + P.seeded() + P.fuel();
}
const tip = document.getElementById('tip');
document.addEventListener('mousemove', (e) => { const g = e.target.closest('[data-tip]'); if (!g) { tip.style.display = 'none'; return; }
  tip.textContent = g.dataset.tip; tip.style.display = 'block'; tip.style.left = (e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; });
document.title = '#953 mods.lib@1: validation evidence';
window.FRAME_COUNT = FRAMES.length;
</script></body></html>
