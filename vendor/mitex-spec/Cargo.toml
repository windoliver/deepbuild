[package]
name = "mitex-spec"
description = "Specification Library for MiTeX"
authors.workspace = true
version = "0.2.7" # DeepBuild patch (windoliver/deepbuild#2359): explicit pin for the carry checker.
license.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true

[[bench]]
name = "spec_constructions"
harness = false

# DeepBuild patch (windoliver/deepbuild#2359): source of this standalone copy, including its license.
[package.metadata]
upstream = { git = "https://github.com/mitex-rs/mitex", rev = "51f7210e026ab05d037125247e92d4d023d8a80d" }

[dependencies]
rkyv = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json.workspace = true
rustc-hash.workspace = true

[features]

# DeepBuild patch (windoliver/deepbuild#2359): rkyv 0.8 feature names; validation stays enabled.
rkyv = ["dep:rkyv", "rkyv/alloc", "rkyv/little_endian"]
rkyv-validation = ["rkyv", "rkyv/bytecheck"]
default = ["serde", "rkyv", "rkyv-validation"]

[dev-dependencies]
once_cell.workspace = true
divan.workspace = true

[lints]
workspace = true

# DeepBuild patch (windoliver/deepbuild#2359): retain upstream inheritance in this standalone crate.
[workspace]
package = { authors = ["Myriad-Dreamin", "OrangeX4", "mgt"], license = "Apache-2.0", edition = "2021", homepage = "https://github.com/mitex-rs/mitex", repository = "https://github.com/mitex-rs/mitex" }
dependencies = { rkyv = { version = "0.8.17", default-features = false, features = ["std"] }, serde = "1.0.188", serde_json = "1.0.106", rustc-hash = "2", once_cell = "1", divan = "0.1.14" }
lints = { rust = { missing_docs = "warn" }, clippy = { uninlined_format_args = "warn", missing_panics_doc = "warn", missing_safety_doc = "warn", undocumented_unsafe_blocks = "warn" } }
